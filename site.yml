---
# Full workstation convergence. Role order matters:
#   1. bootstrap + credentials  (needed to clone anything over SSH)
#   2. packages                 (everything below assumes binaries exist)
#   3. system scope             (/etc, units, groups, bootloader)
#   4. chezmoi                  ($HOME dotfiles)
#   5. roles consuming dotfiles (they read files chezmoi just wrote)
- name: Converge workstation
  hosts: localhost
  gather_facts: true

  roles:
    - role: base
      tags: [base, bootstrap]
    - role: password_manager
      when: secrets_backend == 'pass-cli'
      tags: [secrets, bootstrap]
    - role: secrets
      tags: [secrets, bootstrap]

    - role: packages
      tags: [packages]

    - role: sudoers
      tags: [system, sudoers]
    - role: user_dirs
      tags: [user]
    - role: login_shell
      tags: [system, shell]
    - role: keyboard
      tags: [system, keyboard]
    - role: console
      tags: [system, console]
    - role: desktop_entries
      tags: [system, sessions]
    - role: display_manager
      tags: [system, sddm]
    - role: docker
      when: vms
      tags: [system, docker]
    - role: virtualization
      when: vms
      tags: [system, vms]
    - role: power_profile
      when: gaming
      tags: [system, power]
    - role: devenv
      when: devenv
      tags: [devenv]

    - role: chezmoi
      tags: [dotfiles, chezmoi]
    - role: yazi
      tags: [dotfiles, yazi]
    - role: externals
      tags: [dotfiles, externals]

    - role: audio
      tags: [audio]

  # Roles living in the external checkouts must be pulled in with include_role:
  # a static `roles:` entry is resolved when the playbook is loaded, which is
  # before the externals role has had a chance to clone them.
  tasks:
    - name: Converge roles from external checkouts
      ansible.builtin.include_role:
        name: "{{ item.name }}"
        apply:
          tags: "{{ item.tags }}"
      vars:
        quickshell_repo_path: "{{ target_home }}/Projects/codeberg/quantumfate/quickshell"
        hypr_repo_path: "{{ target_home }}/Projects/codeberg/quantumfate/hypr"
        nvim_repo_path: "{{ target_home }}/Projects/codeberg/quantumfate/nvim"
      loop:
        - name: quickshell
          tags: [dotfiles, quickshell]
        - name: hypr
          tags: [dotfiles, hypr]
        - name: nvim
          tags: [dotfiles, nvim]
      loop_control:
        label: "{{ item.name }}"
      tags: [dotfiles, quickshell, hypr, nvim]

    - name: Converge browser profiles
      ansible.builtin.include_role:
        name: browser_profiles
        apply:
          tags: [dotfiles, browser]
      tags: [dotfiles, browser]

    - name: Converge theming
      ansible.builtin.include_role:
        name: theming
        apply:
          tags: [dotfiles, theming]
      tags: [dotfiles, theming]
