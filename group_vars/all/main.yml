---
# Variables shared by every host: identity, secrets backend, look and feel.
# Single source of truth. Role-specific values belong in
# roles/<role>/defaults/main.yml instead — only values two or more roles read
# belong here.
#
# Anything that differs per machine — profile, monitors, feature flags, role
# overrides — lives in host_vars/<hostname>.yml instead. The defaults below are
# the fallback for a host that has not declared them yet.

profile: desktop # desktop | laptop

primary_monitor: DP-1
secondary_monitor: "" # empty = single-head

# Feature flags. They gate package sets, parts of a role's own lists, and (via
# group_vars/all/roles.yml) whole roles. Flip them per host in host_vars.
gaming: true
vms: true
llms: true
devenv: true

# Identity
target_user: "{{ ansible_facts.user_id }}"
target_home: "{{ ansible_facts.env.HOME }}"
login_shell: /usr/bin/zsh

# Dotfiles
chezmoi_repo: git@github.com:quantumfate/dotfiles.git
chezmoi_source: "{{ target_home }}/.local/share/chezmoi"

# Secrets
# pass-cli: pull SSH/GPG material from Proton Pass at run time
# vault:    read the same material from group_vars/all/vault.yml (ansible-vault)
secrets_backend: pass-cli

# vault: item title per SSH key target, in vault "Productivity"
ssh_key_targets:
  - github
  - gitlab
  - github
  - aur

# Look and feel
keyboard_layout: dvorak-custom
console_font: ter-v32n
sddm_theme_package: catppuccin-sddm-theme-macchiato
gtk_icon_theme_flavour: cat-macchiato-mauve

# Shared browser prefs directory. Two roles touch it: `theming` renders user.js
# into it, `browser_profiles` symlinks that (and the chrome assets) into every
# Zen/Firefox profile. Role defaults are only in scope during their own role, so
# a path two roles share belongs here.
browser_config_src: "{{ target_home }}/.config/zen-chezmoi"
