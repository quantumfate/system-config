# Checkouts and theme archives roles/externals keeps in sync.

# Plugin checkouts. zsh plugins live in roles/zsh; tmux hardcodes its palette.
externals_repos: []

# Personal repos. Pulled ff-only, and skipped entirely while dirty.
externals_projects:
  - name: hypr
    repo: git@codeberg.org:quantumfate/hypr.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/hypr"
  - name: quickshell
    repo: git@codeberg.org:quantumfate/quickshell.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/quickshell"
  - name: nvim
    repo: git@codeberg.org:quantumfate/nvim.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/nvim"
  - name: aiagent
    repo: git@github.com:quantumfate/aiagent.git
    dest: "{{ target_home }}/Projects/github/quantumfate/aiagent"
  - name: lance.nvim
    repo: git@github.com:quantumfate/lance.nvim.git
    dest: "{{ target_home }}/Projects/github/quantumfate/lance.nvim"
  - name: scripts
    repo: git@codeberg.org:quantumfate/scripts.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/scripts"
  - name: security-and-privacy
    repo: git@codeberg.org:quantumfate/security-and-privacy.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/security-and-privacy"
  - name: system-config
    repo: git@codeberg.org:quantumfate/system-config.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/system-config"

# Cloned only when the matching flag in group_vars/all/main.yml is set.
externals_projects_gaming:
  - name: dofus-scripts
    repo: git@codeberg.org:quantumfate/dofus-scripts.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/dofus-scripts"

externals_projects_desktop:
  - name: kbd75-rev2
    repo: git@codeberg.org:quantumfate/kbd75-rev2.git
    dest: "{{ target_home }}/Projects/codeberg/quantumfate/kbd75-rev2"

# Catppuccin themes. archive_subdir is the directory inside the tarball whose
# contents land in dest.
externals_archives:
  - name: btop
    url: https://github.com/catppuccin/btop/archive/refs/heads/main.tar.gz
    archive_subdir: btop-main/themes
    dest: "{{ target_home }}/.config/btop/themes"
  - name: foot
    url: https://github.com/catppuccin/foot/archive/refs/heads/main.tar.gz
    archive_subdir: foot-main/themes
    dest: "{{ target_home }}/.config/foot/themes"
  - name: kitty
    url: https://github.com/catppuccin/kitty/archive/refs/heads/main.tar.gz
    archive_subdir: kitty-main/themes
    dest: "{{ target_home }}/.config/kitty/themes"
  - name: qt5ct
    url: https://github.com/catppuccin/qt5ct/archive/refs/heads/main.tar.gz
    archive_subdir: qt5ct-main/themes
    dest: "{{ target_home }}/.config/qt5ct/colors"
  - name: qt6ct
    url: https://github.com/catppuccin/qt5ct/archive/refs/heads/main.tar.gz
    archive_subdir: qt5ct-main/themes
    dest: "{{ target_home }}/.config/qt6ct/colors"
  - name: kvantum
    url: https://github.com/catppuccin/kvantum/archive/refs/heads/main.tar.gz
    archive_subdir: kvantum-main/themes
    dest: "{{ target_home }}/.config/Kvantum"
  - name: rofi
    url: https://github.com/catppuccin/rofi/archive/refs/heads/main.tar.gz
    archive_subdir: rofi-main/themes
    dest: "{{ target_home }}/.local/share/rofi/themes"
  - name: zathura
    url: https://github.com/catppuccin/zathura/archive/refs/heads/main.tar.gz
    archive_subdir: zathura-main/themes
    dest: "{{ target_home }}/.config/zathura"
  - name: spicetify
    url: https://github.com/catppuccin/spicetify/archive/refs/heads/main.tar.gz
    archive_subdir: spicetify-main/catppuccin
    dest: "{{ target_home }}/.config/spicetify/Themes/catppuccin"
  - name: wlogout-icons
    url: https://github.com/catppuccin/wlogout/archive/refs/heads/main.tar.gz
    archive_subdir: wlogout-main/icons
    dest: "{{ target_home }}/.config/wlogout/catppuccin/icons"
  - name: wlogout-themes
    url: https://github.com/catppuccin/wlogout/archive/refs/heads/main.tar.gz
    archive_subdir: wlogout-main/themes
    dest: "{{ target_home }}/.config/wlogout/catppuccin/themes"

# Single-file downloads.
externals_files: []
