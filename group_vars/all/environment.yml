---
# Login environment. Two roles render from these lists and must agree:
#   session_env -> ~/.config/environment.d (systemd --user, every uwsm session)
#   zsh         -> ~/.zshenv               (shells started outside uwsm)
# Wayland-only vars are not here; they belong to session_env's uwsm templates.

env_paths:
  - "{{ target_home }}/Projects/github/quantumfate/hypr/bin"
  - "{{ target_home }}/Projects/github/quantumfate/security-and-privacy/bin"
  - "{{ target_home }}/.local/bin"
  - "/usr/bin/obsidian"

# Extra PATH entries gated on the devenv feature flag.
env_paths_devenv:
  - "{{ target_home }}/go/bin"
  - "{{ target_home }}/.luarocks/bin"
  - "{{ target_home }}/.cargo/bin"

# Scalar environment variables. Key is the variable name, value is the value.
env_vars:
  PROTON_PASS_LINUX_KEYRING: "dbus"
  PROTON_DLSS_UPGRADE: "1"
  PROTON_DLSS_INDICATOR: "1"
  PROTON_NVIDIA_LIBS: "1"
  PROTON_ENABLE_WAYLAND: "1"
  PROTON_NO_WM_DECORATION: "1"
  PROTON_NO_NTSYNC: "1"
  PROTON_LOCAL_SHADER_CACHE: "1"

# Universal session vars. These apply to every login session (TTY included) and
# complement the Wayland-only block in session_env's uwsm env files.
env_session_vars:
  XDG_CONFIG_HOME: "$HOME/.config"
  BROWSER: "zen-twilight"
  BAT_THEME: "Catppuccin Macchiato"
