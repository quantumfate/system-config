---
# Git checkouts roles/project_checkouts keeps in sync. Cloned if missing, then
# pulled ff-only, and skipped entirely while dirty.
#
# Three of these — hypr, quickshell, nvim — carry their own ansible role, which
# site.yml converges from the checkout after this role has updated it.

projects_repos:
  - name: hypr
    repo: git@github.com:quantumfate/hypr.git
    dest: "{{ target_home }}/Projects/github/quantumfate/hypr"
  - name: quickshell
    repo: git@github.com:quantumfate/quickshell.git
    dest: "{{ target_home }}/Projects/github/quantumfate/quickshell"
  - name: nvim
    repo: git@github.com:quantumfate/nvim.git
    dest: "{{ target_home }}/Projects/github/quantumfate/nvim"
  - name: aiagent
    repo: git@github.com:quantumfate/aiagent.git
    dest: "{{ target_home }}/Projects/github/quantumfate/aiagent"
  - name: lance.nvim
    repo: git@github.com:quantumfate/lance.nvim.git
    dest: "{{ target_home }}/Projects/github/quantumfate/lance.nvim"
  - name: security-and-privacy
    repo: git@github.com:quantumfate/security-and-privacy.git
    dest: "{{ target_home }}/Projects/github/quantumfate/security-and-privacy"
  - name: system-config
    repo: git@github.com:quantumfate/system-config.git
    dest: "{{ target_home }}/Projects/github/quantumfate/system-config"

# Cloned only when the matching flag in group_vars/all/main.yml is set.
projects_repos_gaming:

projects_repos_desktop:
  - name: kbd75-rev2
    repo: git@github.com:quantumfate/kbd75-rev2.git
    dest: "{{ target_home }}/Projects/github/quantumfate/kbd75-rev2"

# Roles that live in a checkout above rather than in roles/. site.yml includes
# them by name; ansible.cfg's roles_path is what makes them resolvable.
projects_with_roles: [hypr, quickshell, nvim]

# name -> dest, so site.yml can hand each external role its checkout path
# without restating it.
projects_dest: >-
  {{ dict(projects_repos | map(attribute='name')
          | zip(projects_repos | map(attribute='dest'))) }}
