[defaults]
inventory            = inventory/hosts.yml
# hypr, quickshell and nvim ship their own role inside their checkout. Listed
# here (roles_path takes no templating) so site.yml can include them by name;
# the checkout paths themselves live in group_vars/all/projects.yml.
roles_path           = roles:~/Projects/codeberg/quantumfate/hypr/ansible/roles:~/Projects/codeberg/quantumfate/quickshell/ansible/roles:~/Projects/codeberg/quantumfate/nvim/ansible/roles
collections_path     = collections
host_key_checking    = False
retry_files_enabled  = False
result_format        = yaml
display_skipped_hosts = False
interpreter_python   = auto_silent
