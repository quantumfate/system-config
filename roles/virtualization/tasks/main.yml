---
# libvirt/KVM with the Cockpit web console on https://localhost:9090.
# Group changes need a re-login before virt-manager works without sudo.

- name: Enable libvirt and cockpit
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - libvirtd.service
    - cockpit.socket

- name: Add the user to the virtualization groups
  become: true
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: [libvirt, kvm, wheel]
    append: true

- name: Allow traffic on the libvirt bridge
  become: true
  community.general.ufw:
    rule: allow
    direction: "{{ item.direction }}"
    interface: virbr0
    route: "{{ item.route }}"
  loop:
    - {direction: in, route: false}
    - {direction: out, route: false}
    - {direction: in, route: true}
    - {direction: out, route: true}
  notify: Reload ufw
