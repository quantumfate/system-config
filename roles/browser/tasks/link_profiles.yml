---
# Find profile directories for browser {{ browser.name }}
- name: Find profile directories for browser {{ browser.name }}
  ansible.builtin.find:
    paths: "{{ browser.path }}"
    file_type: directory
    recurse: false
  register: found_profiles
  failed_when: false

- name: Select real profile directories
  ansible.builtin.set_fact:
    profile_dirs: >-
      {{ found_profiles.files | default([]) | map(attribute='path')
         | reject('search', '\.Default Profile$')
         | reject('search', '/(' ~ (browser_profile_excludes | join('|')) ~ ')$')
         | list }}

- name: Link user.js (idempotent across profile ages)
  # An existing-but-unlinked profile (created by a browser upgrade or by hand)
  # gets its links laid on re-run, not only freshly created ones.
  ansible.builtin.file:
    src: "{{ browser_config_src }}/user.js"
    dest: "{{ item }}/user.js"
    state: link
    force: true
  loop: "{{ profile_dirs }}"

- name: Link Zen profile extras
  ansible.builtin.file:
    src: "{{ browser_config_src }}/{{ item[1] }}"
    dest: "{{ item[0] }}/{{ item[1] }}"
    state: link
    force: true
  loop: "{{ profile_dirs | product(zen_profile_extras) | list }}"
  when: browser.zen

- name: Ensure Zen chrome directories exist
  ansible.builtin.file:
    path: "{{ item }}/chrome"
    state: directory
    mode: "0755"
  loop: "{{ profile_dirs }}"
  when: browser.zen

- name: Link Zen chrome assets
  ansible.builtin.file:
    src: "{{ browser_config_src }}/{{ item[1] }}"
    dest: "{{ item[0] }}/chrome/{{ item[1] }}"
    state: link
    force: true
  loop: "{{ profile_dirs | product(zen_chrome_extras) | list }}"
  when: browser.zen

# Container identities are per-profile material, never the default-container
# choice (that is a Zen UI decision made after provisioning). The merge is by
# name: existing identities keep their id/icon/color, missing ones are added.
- name: Merge declared container identities into each Zen profile
  ansible.builtin.shell:
    cmd: python3 "{{ role_path }}/files/merge_containers.py" "{{ browser.path }}" "{{ item }}" "{{ zen_containers_declared.path }}"
  loop: "{{ profile_dirs }}"
  when: browser.zen
  changed_when: '"updated" in merge_result.stdout'
  register: merge_result

# Modern Firefox and Zen store search engines and one-off visibility in
# search.json.mozlz4, ignoring legacy user.js preferences.
- name: Configure DuckDuckGo default engine and hide one-offs in each Zen profile
  ansible.builtin.shell:
    cmd: python3 "{{ role_path }}/files/configure_search.py" "{{ item }}"
  loop: "{{ profile_dirs }}"
  when: browser.zen
  changed_when: '"search configured" in search_result.stdout'
  register: search_result