---
# Where ~/.config is moved to. Timestamped, so a second reset never overwrites
# the archive left by the first. Nothing is ever deleted.
reset_archive: "{{ target_home }}/.config-pre-reset-{{ ansible_facts.date_time.iso8601_basic_short }}"

# Proof this host has already been flushed. Lives outside ~/.config on purpose —
# the flush would take it along otherwise, and "once" would mean "every run".
reset_marker: "{{ target_home }}/.local/state/system-config/reset-{{ inventory_hostname }}.done"

# Paths restored from the archive right after the flush, relative to ~/.config.
# Empty is a true flush; the archive is still there to copy from by hand.
#
# Candidates — none of these can be regenerated by Ansible or chezmoi:
#   zen, mozilla/firefox        browser profiles: history, cookies, logins, extensions
#   "Proton Pass", "Proton Mail", protonmail, proton-drive-sync
#   vesktop, spotify, obsidian, copyq
reset_config_keep: []

# Run even with a graphical session live. Off for a reason: a running
# Hyprland/quickshell/portal writes its state back out on exit, straight into
# the fresh ~/.config — which is the orphan problem this role exists to fix.
reset_allow_graphical: false
