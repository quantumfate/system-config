---
- name: Clear XKB cache
  become: true
  ansible.builtin.shell:
    cmd: rm -f /var/lib/xkb/*.xkm
  changed_when: true

- name: Rebuild TTY keymap
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && ckbcomp {{ keyboard_layout }} | gzip > /usr/share/kbd/keymaps/xkb/{{ keyboard_layout }}.map.gz
    executable: /bin/bash
  changed_when: true

# Best effort: no-op when the playbook runs from a graphical terminal.
- name: Apply keymap to current VT
  become: true
  ansible.builtin.command: loadkeys /usr/share/kbd/keymaps/xkb/{{ keyboard_layout }}.map.gz
  changed_when: true
  failed_when: false
