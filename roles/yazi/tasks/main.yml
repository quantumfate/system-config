---
# Installs the plugins declared in ~/.config/yazi/package.toml, which chezmoi
# writes — so this role must run after it. Locally modified plugins are left
# alone by `ya pkg install`.

- name: Bootstrap yazi packages
  ansible.builtin.command: ya pkg install
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
  changed_when: false
  when: (target_home + '/.config/yazi/package.toml') is exists
