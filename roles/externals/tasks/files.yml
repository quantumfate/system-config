---
# Single-file downloads (former type = "file" externals).

- name: Ensure single-file theme destinations exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ externals_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Download single-file themes
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop: "{{ externals_files }}"
  loop_control:
    label: "{{ item.name }}"
