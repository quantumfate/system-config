---
# Inverse of main.yml: hand the console back. Not to be confused with
# teardown.yml, which main.yml runs to remove *competing* greeters while sddm
# stays. A host that wants a different login screen sets `display_manager:
# false`; making that run mid-session stops sddm (and with it the live seat),
# so it must be undone only from outside the graphical session.

- name: Disable sddm
  become: true
  ansible.builtin.systemd_service:
    name: sddm.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove the sddm drop-ins this role wrote
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sddm.conf.d/theme.conf
    - /etc/sddm/Xsetup
