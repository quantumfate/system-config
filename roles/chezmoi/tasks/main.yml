---
# chezmoi itself comes from common_packages — this role only runs after
# roles/packages, so it never installs its own binary.

# The source dir doubles as the dotfiles dev checkout, so a dirty tree is
# normal. Pull only when it is clean — never discard uncommitted work.
- name: Check the dotfiles checkout for local modifications
  ansible.builtin.command: git status --porcelain
  args:
    chdir: "{{ chezmoi_source }}"
  register: chezmoi_dirty
  changed_when: false
  failed_when: false
  check_mode: false

# git's module never repoints an existing checkout, and chezmoi uses `origin`
# as its own update remote — so force it here.
- name: Check the dotfiles origin remote
  ansible.builtin.command: git remote get-url origin
  args:
    chdir: "{{ chezmoi_source }}"
  register: chezmoi_origin
  changed_when: false
  failed_when: false
  check_mode: false

- name: Point the dotfiles origin at {{ chezmoi_repo }}
  ansible.builtin.command: git remote set-url origin {{ chezmoi_repo }}
  args:
    chdir: "{{ chezmoi_source }}"
  changed_when: true
  when: chezmoi_origin.stdout != chezmoi_repo

- name: Clone or update the dotfiles source
  ansible.builtin.git:
    repo: "{{ chezmoi_repo }}"
    dest: "{{ chezmoi_source }}"
    version: "{{ chezmoi_version | default('HEAD') }}"
    update: "{{ chezmoi_update | default(true) }}"
    accept_newhostkey: true
  when: chezmoi_dirty.stdout | default('') | length == 0

- name: Report a dirty dotfiles checkout
  ansible.builtin.debug:
    msg: >-
      {{ chezmoi_source }} has uncommitted changes — skipped the pull and
      applying the working tree as-is.
  when: chezmoi_dirty.stdout | default('') | length > 0

- name: Ensure the chezmoi config directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/chezmoi"
    state: directory
    mode: "0755"

- name: Render the chezmoi config
  ansible.builtin.template:
    src: chezmoi.toml.j2
    dest: "{{ target_home }}/.config/chezmoi/chezmoi.toml"
    mode: "0644"

- name: Apply the dotfiles
  ansible.builtin.command: chezmoi apply --force
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | length > 0
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Reload the systemd user manager
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  failed_when: false

# Keeps .chezmoiexternal.toml fresh between playbook runs; the apply above
# already refreshes anything stale.
- name: Ensure the systemd user dir exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Deploy the chezmoi-externals user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - chezmoi-externals.service
    - chezmoi-externals.timer
  notify: Restart chezmoi-externals timer

# Only the timer is enabled; the oneshot service stays trigger-driven so
# `systemctl --user start chezmoi-externals` is a clean manual check.
- name: Enable the chezmoi-externals timer
  ansible.builtin.systemd_service:
    name: chezmoi-externals.timer
    enabled: true
    state: started
    daemon_reload: true
    scope: user
