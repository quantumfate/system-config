---
# age is normally already pulled in by common_packages; installed here too so
# this role stands on its own if that ever changes.
- name: Install age
  community.general.pacman:
    name: age
    state: present
  become: true
  when: state_backup_deploy | bool

- name: Ensure the recipients dir exists
  ansible.builtin.file:
    path: "{{ state_backup_recipients_file | dirname }}"
    state: directory
    mode: "0755"
  when: state_backup_deploy | bool

- name: Check a recipients file already exists
  ansible.builtin.stat:
    path: "{{ state_backup_recipients_file }}"
  register: state_backup_recipients_stat
  when: state_backup_deploy | bool

- name: Report the missing recipients file
  ansible.builtin.debug:
    msg: >-
      No age recipients at {{ state_backup_recipients_file }} — the backup
      unit will refuse to run until one exists. See this role's README.
  when:
    - state_backup_deploy | bool
    - not state_backup_recipients_stat.stat.exists

- name: Ensure systemd user dir exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user"
    state: directory
    mode: "0755"
  when: state_backup_deploy | bool

- name: Deploy state-backup user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - state-backup.service
    - state-backup.timer
  notify: Restart state-backup timer
  when: state_backup_deploy | bool

# Only the timer is enabled; the service is oneshot and stays trigger-driven
# so `systemctl --user start state-backup` is a clean manual run.
- name: Enable state-backup timer
  ansible.builtin.systemd_service:
    name: state-backup.timer
    enabled: true
    state: started
    daemon_reload: true
    scope: user
  when: state_backup_deploy | bool
