# Bluetooth profile policy.
#
# autoswitch-to-headset-profile: always expose the headset mic as a source, and
# flip the card A2DP -> HSP/HFP when an app opens a capture stream (and back on
# release). Matches upstream default; pinned here so the behaviour is declared,
# not inherited.
#
# profile-preference "quality": prefer AAC/SBC-XQ over low-latency codecs when
# auto-selecting the playback profile.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = true
  bluetooth.profile-preference = "quality"
}
