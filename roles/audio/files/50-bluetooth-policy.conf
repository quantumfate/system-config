# Bluetooth profile policy. Matches the upstream defaults; pinned so the
# behaviour is declared rather than inherited from the distro config.
#
#   autoswitch-to-headset-profile  A2DP -> HSP/HFP while an app is recording
#   profile-preference "quality"   prefer AAC/SBC-XQ over low-latency codecs
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = true
  bluetooth.profile-preference = "quality"
}
