---
# === WirePlumber hooks ===
- name: Ensure WirePlumber scripts dir exists
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/wireplumber/scripts"
    state: directory
    mode: "0755"
  when: audio_deploy_wireplumber_hooks | bool

- name: Ensure WirePlumber hook drop-in dir exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/wireplumber/wireplumber.conf.d"
    state: directory
    mode: "0755"
  when: audio_deploy_wireplumber_hooks | bool

- name: Deploy WirePlumber audio hooks
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ target_home }}/.local/share/wireplumber/scripts/{{ item }}"
    mode: "0644"
  loop:
    - 90-bt-auto-switch.lua
  when: audio_deploy_wireplumber_hooks | bool

- name: Deploy WirePlumber hook config
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ target_home }}/.config/wireplumber/wireplumber.conf.d/{{ item }}"
    mode: "0644"
  loop:
    - 90-bt-auto-switch.conf
  when: audio_deploy_wireplumber_hooks | bool

# === Audio notification service ===
# The notification script lives in the scripts repo (cloned by the externals
# role). The systemd unit references it at the known path.
- name: Ensure systemd user dir exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user"
    state: directory
    mode: "0755"
  when: audio_deploy_notification_service | bool

- name: Deploy audio-notify user unit
  ansible.builtin.template:
    src: audio-notify.service.j2
    dest: "{{ target_home }}/.config/systemd/user/audio-notify.service"
    mode: "0644"
  when: audio_deploy_notification_service | bool

- name: Enable audio-notify user unit
  ansible.builtin.systemd_service:
    name: audio-notify.service
    enabled: true
    scope: user
  when: audio_deploy_notification_service | bool
