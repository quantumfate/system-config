---
# Make a connecting Bluetooth sink the default one, and fall back on disconnect.
audio_deploy_wireplumber_hooks: true

# Notify on default-sink changes. Needs libnotify.
audio_deploy_notification_service: true

# Expose the headset mic and switch A2DP -> HSP/HFP while recording. HFP is
# 16 kHz mono, so playback quality drops while the mic is in use.
audio_deploy_bluetooth_policy: true
