---
# Every toolkit needs telling separately: GTK2/3/4, Qt (qt5ct/qt6ct + Kvantum),
# xsettingsd for XWayland, and dconf for the portals and their file dialogs.
- name: Install the theme assets
  kewlfft.aur.aur:
    name: "{{ theme_packages }}"
    use: yay
    state: present
  become: false
  when: theme_packages | length > 0
  tags: [privileged]

# Apps catppuccin ships as a tarball rather than a package.
- name: Install the per-app theme archives
  ansible.builtin.include_tasks: archives.yml
  when: theme_archives | length > 0

- name: Ensure the theming config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ target_home }}/.config/gtk-3.0"
    - "{{ target_home }}/.config/gtk-4.0"
    - "{{ target_home }}/.config/qt5ct"
    - "{{ target_home }}/.config/qt6ct"
    - "{{ target_home }}/.config/Kvantum"
    - "{{ target_home }}/.config/xsettingsd"
    - "{{ target_home }}/.config/environment.d"
    - "{{ target_home }}/.icons/default"
    - "{{ target_home }}/.local/share/nwg-look"
    # Skeletons previously shipped by chezmoi (btop, rofi, wlogout, zathura);
    # now rendered here so a converge owns them exactly once, and the live
    # palette seam is written by `,theme.sh` at the end of the run.
    - "{{ target_home }}/.config/btop"
    - "{{ target_home }}/.config/rofi"
    - "{{ target_home }}/.config/wlogout"
    - "{{ target_home }}/.config/zathura"
    - "{{ target_home }}/.local/share/rofi/themes"

- name: Render the toolkit settings
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: gtkrc-2.0.j2, dest: "{{ target_home }}/.gtkrc-2.0.mine"}
    - {src: gtk3-settings.ini.j2, dest: "{{ target_home }}/.config/gtk-3.0/settings.ini"}
    - {src: gtk4-settings.ini.j2, dest: "{{ target_home }}/.config/gtk-4.0/settings.ini"}
    - {src: qt5ct.conf.j2, dest: "{{ target_home }}/.config/qt5ct/qt5ct.conf"}
    - {src: qt6ct.conf.j2, dest: "{{ target_home }}/.config/qt6ct/qt6ct.conf"}
    - {src: kvantum.kvconfig.j2, dest: "{{ target_home }}/.config/Kvantum/kvantum.kvconfig"}
    - {src: xsettingsd.conf.j2, dest: "{{ target_home }}/.config/xsettingsd/xsettingsd.conf"}
    - {src: cursor-index.theme.j2, dest: "{{ target_home }}/.icons/default/index.theme"}
    - {src: nwg-look-gsettings.j2, dest: "{{ target_home }}/.local/share/nwg-look/gsettings"}
    - {src: environment.d-theming.conf.j2, dest: "{{ target_home }}/.config/environment.d/50-theming.conf"}
  loop_control:
    label: "{{ item.dest | basename }}"
  notify: Reload xsettingsd

# App skeletons whose palette seam `,theme.sh` owns, re-pointed at the end of
# the run. Rendered here, not chezmoi, so a converge cannot fight chezmoi's
# login-time re-apply of an older seed.
- name: Render the app skeleton configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: btop.conf.j2, dest: "{{ target_home }}/.config/btop/btop.conf"}
    - {src: rofi-config.rasi.j2, dest: "{{ target_home }}/.config/rofi/config.rasi"}
    - {src: custom-rasi.j2, dest: "{{ target_home }}/.local/share/rofi/themes/custom.rasi"}
    - {src: wlogout-style.css.j2, dest: "{{ target_home }}/.config/wlogout/style.css"}
    - {src: zathurarc.j2, dest: "{{ target_home }}/.config/zathura/zathurarc"}
  loop_control:
    label: "{{ item.dest | basename }}"

# libadwaita ignores gtk-theme-name; only the stylesheet under ~/.config/gtk-4.0
# themes a GTK4 app. Links, so a theme update lands without re-running the role.
- name: Link the GTK4 stylesheets from the installed theme
  ansible.builtin.file:
    src: "/usr/share/themes/{{ theme_gtk }}/gtk-4.0/{{ item }}"
    dest: "{{ target_home }}/.config/gtk-4.0/{{ item }}"
    state: link
    force: true
  loop:
    - gtk.css
    - gtk-dark.css
    - assets

# Portals and Flatpaks read the GSettings desktop-interface schema, not
# settings.ini — without this the app is themed and its file chooser is not.
- name: Publish the theme to dconf for the portals
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - {key: gtk-theme, value: "'{{ theme_gtk }}'"}
    - {key: icon-theme, value: "'{{ theme_icons }}'"}
    - {key: cursor-theme, value: "'{{ theme_cursor }}'"}
    - {key: cursor-size, value: "{{ theme_cursor_size }}"}
    - {key: font-name, value: "'{{ theme_ui_font }} {{ theme_ui_font_size }}'"}
    - {key: monospace-font-name, value: "'{{ theme_mono_font }} {{ theme_mono_font_size }}'"}
    - {key: document-font-name, value: "'{{ theme_ui_font }} {{ theme_ui_font_size }}'"}
    - {key: color-scheme, value: "'prefer-dark'"}
    - {key: font-antialiasing, value: "'rgba'"}
    - {key: font-hinting, value: "'slight'"}
  loop_control:
    label: "{{ item.key }}"

- name: Remove the matugen leftovers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ theme_stale_files }}"

# `become` rather than letting papirus-folders call sudo itself: its internal
# sudo has no tty during a play.
- name: Recolour Papirus folders
  become: true
  ansible.builtin.command: papirus-folders -C {{ gtk_icon_theme_flavour }} --theme Papirus-Dark
  register: papirus
  changed_when: "'already' not in papirus.stdout"
  tags: [privileged]

# kitty.conf includes `current-theme.conf`, a symlink `,theme.sh` repoints. It
# must exist before that file lands: a missing include is a kitty startup error,
# not a warning.
- name: Seed the kitty theme link
  ansible.builtin.file:
    src: "themes/{{ theme_flavour }}.conf"
    dest: "{{ target_home }}/.config/kitty/current-theme.conf"
    state: link
    force: true
    follow: false

# Everything below renders the SEED flavour. The live choice belongs to the
# theme store, so the last thing a converge does is hand the decision back to
# it — otherwise a playbook run silently reverts a palette you picked weeks ago.
# Does nothing when the scripts checkout is not there yet (a first run, before
# roles/project_checkouts) — the seed above is already correct in that case.
- name: Re-assert the theme store over the rendered seed
  ansible.builtin.command: "{{ theme_apply_script }} apply"
  register: theme_apply
  changed_when: false
  failed_when: false
  when: theme_apply_script is file
