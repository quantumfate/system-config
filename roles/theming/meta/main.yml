---
galaxy_info:
  role_name: theming
  namespace: local
  author: local
  description: >-
    GTK, Qt, cursor and browser theming — one flavour, one accent, one type
    scale, published to every toolkit and to the XDG portals.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: ArchLinux
      versions:
        - all
  galaxy_tags:
    - theming
    - gtk
    - qt

# Required, not cosmetic: yay shells out to sudo with no tty, so it needs the
# warm sudo timestamp base leaves behind. Without it `-t theming` fails with
# "sudo: a terminal is required" while a full converge works.
dependencies:
  - role: base
