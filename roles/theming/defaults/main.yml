---
# Which flavour a freshly provisioned machine starts on. It is a SEED, not the
# answer: the live choice lives in the theme store ($XDG_STATE_HOME/theme.json)
# and is applied by `,theme.sh`, which this role calls at the end of a converge
# so a playbook run re-asserts the store rather than this value.
theme_flavour: macchiato
theme_accent: mauve

# Every flavour is installed, because switching at runtime can only pick from
# what is on disk. Adding one here is the whole of "make it switchable to X".
theme_flavours:
  - latte
  - frappe
  - macchiato
  - mocha

# Derived theme directory names — one dir per flavour+accent pair.
theme_gtk: "catppuccin-{{ theme_flavour }}-{{ theme_accent }}-standard+default"
theme_cursor: "catppuccin-{{ theme_flavour }}-{{ theme_accent }}-cursors"
theme_kvantum: "catppuccin-{{ theme_flavour }}-{{ theme_accent }}"
theme_qt_colors: "catppuccin-{{ theme_flavour }}-{{ theme_accent }}"
theme_icons: Papirus-Dark

# The accent for surfaces that take a colour instead of a theme name (Zen).
theme_accent_hex: "#c6a0f6"

# UI type. One notch above the GTK/Qt defaults; mono font is the terminal's.
theme_ui_font: "Adwaita Sans"
theme_ui_font_size: 12
theme_mono_font: "Hack Nerd Font Mono"
theme_mono_font_size: 12

# The fan-out that applies the theme store to kitty, GTK, Qt and the wallpaper.
# Lives in the scripts checkout, which is on PATH for a login shell but not for
# an Ansible command.
theme_apply_script: "{{ target_home }}/Projects/codeberg/quantumfate/scripts/bin/,theme.sh"

# How often the sun timer re-resolves the palette. The script decides day vs
# night; this only sets how soon after the boundary the desk notices.
theme_auto_interval: hourly

# Pointer size. Nothing else scales the cursor, so it is set large here.
theme_cursor_size: 28

# Theme assets. Repo and AUR in one yay transaction; the `base` dependency in
# meta/main.yml is what leaves a valid sudo timestamp for it.
theme_packages: >-
  {{
    theme_flavours | map('regex_replace', '^', 'catppuccin-gtk-theme-') | list
    + theme_flavours | map('regex_replace', '^', 'catppuccin-cursors-') | list
    + theme_extra_packages
  }}

theme_extra_packages:
  - papirus-icon-theme
  - papirus-folders
  - kvantum
  - qt6ct
  - qt5ct
  - xsettingsd
  - adwaita-fonts

# Leftover matugen overrides. User-level, so they win over the theme until removed.
theme_stale_files:
  - "{{ target_home }}/.config/gtk-3.0/gtk.css"
  - "{{ target_home }}/.config/gtk-3.0/dank-colors.css"
  - "{{ target_home }}/.config/gtk-4.0/dank-colors.css"
  - "{{ target_home }}/.config/kitty/dank-tabs.conf"
  - "{{ target_home }}/.config/kitty/dank-theme.conf"

# Per-app catppuccin theme tarballs, unpacked into each app's theme dir.
# archive_subdir is the directory inside the tarball whose contents land in dest.
#
# Only themes a role-rendered config points at: kitty.conf (roles/zsh), the
# qt5ct/qt6ct/Kvantum files here. Themes a chezmoi-owned config includes — btop,
# foot, rofi, zathura, spicetify, wlogout — are .chezmoiexternal entries in the
# dotfiles instead, so each theme lives with the config that needs it.
theme_archives:
  - name: kitty
    url: https://github.com/catppuccin/kitty/archive/refs/heads/main.tar.gz
    archive_subdir: kitty-main/themes
    dest: "{{ target_home }}/.config/kitty/themes"
  - name: qt5ct
    url: https://github.com/catppuccin/qt5ct/archive/refs/heads/main.tar.gz
    archive_subdir: qt5ct-main/themes
    dest: "{{ target_home }}/.config/qt5ct/colors"
  - name: qt6ct
    url: https://github.com/catppuccin/qt5ct/archive/refs/heads/main.tar.gz
    archive_subdir: qt5ct-main/themes
    dest: "{{ target_home }}/.config/qt6ct/colors"
  - name: kvantum
    url: https://github.com/catppuccin/kvantum/archive/refs/heads/main.tar.gz
    archive_subdir: kvantum-main/themes
    dest: "{{ target_home }}/.config/Kvantum"
  - name: rofi
    url: https://github.com/catppuccin/rofi/archive/refs/heads/main.tar.gz
    archive_subdir: rofi-main/themes
    dest: "{{ target_home }}/.local/share/rofi/themes"
  - name: zathura
    url: https://github.com/catppuccin/zathura/archive/refs/heads/main.tar.gz
    archive_subdir: zathura-main/themes
    dest: "{{ target_home }}/.config/zathura"
  - name: spicetify
    url: https://github.com/catppuccin/spicetify/archive/refs/heads/main.tar.gz
    archive_subdir: spicetify-main/catppuccin
    dest: "{{ target_home }}/.config/spicetify/Themes/catppuccin"
  - name: wlogout-icons
    url: https://github.com/catppuccin/wlogout/archive/refs/heads/main.tar.gz
    archive_subdir: wlogout-main/icons
    dest: "{{ target_home }}/.config/wlogout/catppuccin/icons"
  - name: wlogout-themes
    url: https://github.com/catppuccin/wlogout/archive/refs/heads/main.tar.gz
    archive_subdir: wlogout-main/themes
    dest: "{{ target_home }}/.config/wlogout/catppuccin/themes"
