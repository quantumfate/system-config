---
# Logging workspace. Bookmarked in tms so it opens in its own tmux session.
zsh_log_dir: "{{ target_home }}/.local/share/logs"

# kitty instance class for the log viewer. The hypr repo has windowrules for it.
zsh_kitty_log_class: logviewer

# The log viewer window: same font, more air than the everyday terminal.
zsh_log_font_size: "{{ zsh_terminal_font_size }}"
zsh_log_padding: "14 16 10 16"   # kitty window_padding_width, T R B L
zsh_log_line_height: 138         # cell height, % of the font's line box

# Accent for every terminal surface — kitty cursor, tmux bars, fzf, the log
# prompt. Severity colours stay semantic, see the tailspin theme.
zsh_log_accent: "#c6a0f6"

# --- Catppuccin Macchiato palette -------------------------------------------
# For the tools that take colours rather than a theme name: delta, LESS_TERMCAP,
# fzf, eza. bat and tailspin ship the same palette as a named theme.
zsh_palette:
  base: "#24273a"
  mantle: "#1e2030"
  surface0: "#363a4f"
  surface1: "#494d64"
  surface2: "#5b6078"
  overlay0: "#6e738d"
  overlay1: "#8087a2"
  text: "#cad3f5"
  subtext0: "#a5adcb"
  red: "#ed8796"
  green: "#a6da95"
  yellow: "#eed49f"
  blue: "#8aadf4"
  mauve: "#c6a0f6"
  teal: "#8bd5ca"
  peach: "#f5a97f"
  lavender: "#b7bdf8"
  # Diff backgrounds, blended into `base`. The -emph pair marks the changed
  # span inside a line, so it sits a step brighter.
  diff_minus: "#5b3a44"
  diff_minus_emph: "#894a5b"
  diff_plus: "#3e5240"
  diff_plus_emph: "#4f6f52"


# --- Typography -------------------------------------------------------------
# Only kitty can set these: line height is a property of the cell grid, so no
# TUI inside the terminal can loosen its own rows.
zsh_terminal_font: "Hack Nerd Font Mono"
zsh_terminal_font_size: 14
zsh_terminal_line_height: 130      # cell height, % of the font's line box
zsh_terminal_padding: "12 14 10 14"  # kitty window_padding_width, T R B L

# Socket of the isolated log tmux server — own config, prefix and session list,
# so killing it never touches the coding server.
zsh_tmux_log_socket: logs

# Working dir for log windows. On tmpfs and outside the project tree, so a
# stray glob or fuzzy-find cannot wander into code.
zsh_log_workdir: "/run/user/{{ ansible_facts.user_uid | default(1000) }}/logview"

# antidote bundles for the interactive shell, one spec per line as
# ~/.zsh_plugins.txt expects. Update with `antidote update`.
#
# Order is load order, and two entries are pinned:
#   * zsh-defer first — later entries and .zshrc call it.
#   * syntax-highlighting near the end (it hooks the ZLE widgets that exist at
#     load time), with history-substring-search after it or its highlighting is
#     overwritten.
zsh_plugins:
  # `zsh-defer <cmd>` runs cmd after the first prompt paints — where every slow
  # `eval "$(tool init)"` belongs.
  - romkatv/zsh-defer

  - zsh-users/zsh-autosuggestions
  - zsh-users/zsh-completions
  - Aloxaf/fzf-tab
  - Freed-Wu/fzf-tab-source
  - hlissner/zsh-autopair
  - marlonrichert/zsh-edit
  - mass8326/zsh-chezmoi

  # fzf over git. The `f`-prefixed wrappers in .zshrc are the entry points.
  - wfxr/forgit
  # ^Z as a toggle: suspends, and resumes from an empty line.
  - mdumitru/fancy-ctrl-z
  # `bd <dir>` — jump up to a named ancestor without counting `..`.
  - Tarrasch/zsh-bd
  # Prints the alias you forgot you wrote.
  - MichaelAquilina/zsh-you-should-use

  - zsh-users/zsh-syntax-highlighting
  - zsh-users/zsh-history-substring-search

# Bundle list and the static load file antidote generates from it; .zshrc
# sources the static one.
zsh_plugins_file: "{{ target_home }}/.zsh_plugins.txt"
zsh_plugins_static: "{{ target_home }}/.zsh_plugins.zsh"

# Copy of the role's README that the Alt-h popup reads — docs and cheatsheet
# are the same file.
zsh_cheatsheet: "{{ target_home }}/.config/zsh/cheatsheet.md"

# History
zsh_history_file: "{{ target_home }}/.zsh_history"
zsh_history_size: "10000"

# Viewers the lessfilter dispatcher and the log aliases dispatch to.
zsh_log_packages:
  # Text / log viewers
  - bat
  - eza
  - tailspin
  - python-pygments   # pygmentize text fallback
  - jq                # json branch, hyprland alias
  - chafa             # image terminal renderer
  - lesspipe          # LESSOPEN driver
  - libarchive        # bsdtar — archive table of contents
  # Specific file-type branches
  - sqlite            # vnd.sqlite3 branch
  - poppler           # pdftotext branch
  - perl-image-exiftool  # image metadata
  # Pulled only when zsh_log_binary_viewers is on.
  - jupyter-notebook  # ipynb branch
  - python-pandas
  - python-numpy
  - python-lmdb       # data.mdb branch
  - python-plotext    # AUR: tfevents plotting

# Tools the .zshrc aliases and functions call directly.
zsh_cli_packages:
  - git-delta          # side-by-side, syntax-aware git pager
  - difftastic         # structural diff — `gdt`, ignores pure reformatting
  - git-absorb         # auto-fixup a change into the commit that introduced it
  - direnv             # per-directory env, loaded on cd
  - pkgfile            # command-not-found: names the package for a missing binary
  - watchexec          # re-run a command when files change
  - entr               # the same, fed from a pipe of paths
  - hyperfine          # statistically honest command benchmarks
  - tokei              # lines of code by language
  - dust               # du that sorts and draws
  - procs              # ps with a readable table and tree
  - sd                 # sed for the 90% case, no regex dialect surprises
  - just               # project-local command runner (justfile)

# Multi-GB installs for .tfevents / .pth files. Off unless you read those.
zsh_log_binary_viewers: false
zsh_log_binary_packages:
  - python-tensorboard
  - python-tensorflow
  - python-pytorch

# tspin theme. Rendered by the role; point elsewhere to use your own file.
zsh_tailspin_theme: "{{ target_home }}/.config/tailspin/theme.toml"

# bat theme for every non-log file, including through .lessfilter.
zsh_bat_theme: "Catppuccin Macchiato"

# delta's chrome, which the bat syntax theme does not reach: diff backgrounds,
# file and hunk headers, the line-number gutter. A `syntax` foreground leaves
# the highlighting to bat and only paints the background behind it.
zsh_delta_options: >-
  --navigate --line-numbers --hyperlinks
  --syntax-theme='{{ zsh_bat_theme }}'
  --true-color=always
  --minus-style='syntax {{ zsh_palette.diff_minus }}'
  --minus-non-emph-style='syntax {{ zsh_palette.diff_minus }}'
  --minus-emph-style='syntax {{ zsh_palette.diff_minus_emph }}'
  --minus-empty-line-marker-style='syntax {{ zsh_palette.diff_minus }}'
  --plus-style='syntax {{ zsh_palette.diff_plus }}'
  --plus-non-emph-style='syntax {{ zsh_palette.diff_plus }}'
  --plus-emph-style='syntax {{ zsh_palette.diff_plus_emph }}'
  --plus-empty-line-marker-style='syntax {{ zsh_palette.diff_plus }}'
  --zero-style='syntax'
  --whitespace-error-style='{{ zsh_palette.base }} {{ zsh_palette.red }}'
  --file-style='bold {{ zsh_palette.mauve }}'
  --file-decoration-style='{{ zsh_palette.surface1 }} ul'
  --hunk-header-style='file line-number syntax'
  --hunk-header-decoration-style='{{ zsh_palette.surface1 }} box'
  --hunk-header-file-style='{{ zsh_palette.lavender }}'
  --hunk-header-line-number-style='{{ zsh_palette.teal }}'
  --line-numbers-minus-style='{{ zsh_palette.red }}'
  --line-numbers-plus-style='{{ zsh_palette.green }}'
  --line-numbers-zero-style='{{ zsh_palette.overlay0 }}'
  --line-numbers-left-style='{{ zsh_palette.surface2 }}'
  --line-numbers-right-style='{{ zsh_palette.surface2 }}'
  --blame-palette='{{ zsh_palette.base }} {{ zsh_palette.mantle }}
  {{ zsh_palette.surface0 }} {{ zsh_palette.surface1 }}'
  --blame-code-style='syntax'
  --merge-conflict-begin-symbol='~'
  --merge-conflict-end-symbol='~'
  --merge-conflict-ours-diff-header-style='{{ zsh_palette.yellow }} bold'
  --merge-conflict-theirs-diff-header-style='{{ zsh_palette.yellow }} bold'

# tmux-sessionizer. Fixed entries in its fzf picker.
zsh_tms_bookmarks:
  - "{{ target_home }}"
  - "{{ target_home }}/Documents/Obsidian/Main"
  - "{{ target_home }}/.config/yazi"
  - "{{ zsh_log_dir }}"

zsh_tms_search_dirs:
  - path: "{{ target_home }}/Projects/"
    depth: 10

zsh_tms_excluded_dirs:
  - node_modules
  - target
  - .git
