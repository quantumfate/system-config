---
galaxy_info:
  role_name: zsh
  namespace: local
  author: local
  description: >-
    Templates the zsh interactive shell, its plugins, the lessfilter
    dispatcher, and the logging workspace.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: ArchLinux
      versions:
        - all
  galaxy_tags:
    - shell
    - zsh
    - logging

dependencies:
  # antidote must exist before this role can render ~/.zsh_plugins.zsh, and
  # packages is what installs zsh-antidote (from common_packages).
  - role: packages
