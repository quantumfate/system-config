---
# The everyday terminal: kitty owns typography and space, .tmux.conf the status
# bar of the coding server. Both share the variables in defaults/main.yml with
# the log viewer.

- name: Ensure the kitty config directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/kitty"
    state: directory
    mode: "0755"

- name: Render kitty.conf
  ansible.builtin.template:
    src: kitty.conf.j2
    dest: "{{ target_home }}/.config/kitty/kitty.conf"
    mode: "0644"

- name: Render the coding server's .tmux.conf
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: "{{ target_home }}/.tmux.conf"
    mode: "0644"

# Without this a typo surfaces only at the next server start.
- name: Validate the tmux config
  ansible.builtin.command:
    cmd: tmux -L ansible-validate -f "{{ target_home }}/.tmux.conf" new-session -d -s validate true
  changed_when: false
  register: tmux_validate
  failed_when: tmux_validate.rc != 0
  notify: Kill the tmux validation server

- name: Ensure the fastfetch config directory exists
  ansible.builtin.file:
    path: "{{ fastfetch_config_dir }}"
    state: directory
    mode: "0755"

# Shipped with the role, so a fresh machine has a logo before the first shell.
- name: Deploy the fastfetch logo images
  ansible.builtin.copy:
    src: "{{ role_path }}/files/fastfetch/"
    dest: "{{ fastfetch_config_dir }}/"
    mode: "0644"

- name: Render the fastfetch banner config
  ansible.builtin.template:
    src: fastfetch.jsonc.j2
    dest: "{{ fastfetch_config }}"
    mode: "0644"

# A typo here is otherwise a wall of errors on top of every new shell.
- name: Validate the fastfetch config
  ansible.builtin.command:
    cmd: fastfetch --config "{{ fastfetch_config }}" --logo none --pipe true
  changed_when: false
  register: fastfetch_check
  failed_when: fastfetch_check.rc != 0
