---
# The interactive shell: plugin set, rendered dotfiles, logging workspace and
# the packages behind them.

- name: Install the log-viewing toolchain
  ansible.builtin.include_tasks: install.yml

- name: Render the antidote bundle file
  ansible.builtin.template:
    src: zsh_plugins.txt.j2
    dest: "{{ zsh_plugins_file }}"
    mode: "0644"

- name: Clone/update plugins with antidote and render the static load file
  ansible.builtin.command:
    cmd: >-
      zsh -c 'source /usr/share/zsh-antidote/antidote.zsh &&
      antidote bundle < "{{ zsh_plugins_file }}" > "{{ zsh_plugins_static }}"'
  environment:
    # zsh-syntax-highlighting's HTTPS clone fails under HTTP/2 here (git prompts
    # for a username, then errors). Scoped so the user's git config is untouched.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "http.version"
    GIT_CONFIG_VALUE_0: "HTTP/1.1"
  register: antidote_bundle
  changed_when: antidote_bundle.rc == 0
  failed_when: antidote_bundle.rc != 0

- name: Build the logging workspace
  ansible.builtin.include_tasks: logging.yml

- name: Include tmux-sessionizer helpers
  ansible.builtin.include_tasks: tmux.yml
  when: profile == 'desktop' or profile == 'laptop'

- name: Render the terminal surface (kitty + the coding tmux server)
  ansible.builtin.include_tasks: terminal.yml

- name: Render .zshenv
  ansible.builtin.template:
    src: zshenv.j2
    dest: "{{ target_home }}/.zshenv"
    mode: "0644"

# Centralised environment: ~/.config/environment.d/ is read by systemd --user
# at login, so every uwsm session inherits these vars automatically. The same
# variable lists drive .zshenv above (for shells outside uwsm).

- name: Ensure the environment.d directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/environment.d"
    state: directory
    mode: "0755"

- name: Render the centralised environment file
  ansible.builtin.template:
    src: environment.d.j2
    dest: "{{ target_home }}/.config/environment.d/00-shell.conf"
    mode: "0644"

# uwsm session files: Wayland compositor-level vars only. Shared vars (PATH,
# Proton, BROWSER, BAT_THEME) live in environment.d above.

- name: Ensure the uwsm config directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/uwsm"
    state: directory
    mode: "0755"

- name: Render the uwsm session environment
  ansible.builtin.template:
    src: uwsm-env.j2
    dest: "{{ target_home }}/.config/uwsm/env"
    mode: "0644"

- name: Render the uwsm niri session environment
  ansible.builtin.template:
    src: uwsm-env-niri.j2
    dest: "{{ target_home }}/.config/uwsm/env-niri"
    mode: "0644"

- name: Render .zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ target_home }}/.zshrc"
    mode: "0644"

- name: Deploy the lessfilter dispatcher
  ansible.builtin.template:
    src: lessfilter.j2
    dest: "{{ target_home }}/.lessfilter"
    mode: "0755"

- name: Ensure the zsh config directory exists
  ansible.builtin.file:
    path: "{{ zsh_cheatsheet | dirname }}"
    state: directory
    mode: "0755"

- name: Deploy the shell cheatsheet the Alt-h popup reads
  ansible.builtin.copy:
    src: "{{ role_path }}/README.md"
    dest: "{{ zsh_cheatsheet }}"
    mode: "0644"

- name: Validate .zshrc syntax
  ansible.builtin.command:
    cmd: zsh -n "{{ target_home }}/.zshrc"
  register: zsh_n
  changed_when: false
  failed_when: zsh_n.rc != 0
