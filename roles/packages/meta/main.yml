---
galaxy_info:
  role_name: packages
  namespace: local
  author: local
  description: Installs the system package set (repo + AUR) through yay.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: ArchLinux
      versions:
        - all
  galaxy_tags:
    - packages
    - yay
    - aur

# Real requirement: base installs yay, which every task here runs through.
# (The sudo timestamp yay also needs is warmed by site.yml's pre_tasks.)
dependencies:
  - role: base
