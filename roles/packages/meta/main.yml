---
galaxy_info:
  role_name: packages
  namespace: local
  author: local
  description: Installs the system package set (repo + AUR) through yay.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: ArchLinux
      versions:
        - all
  galaxy_tags:
    - packages
    - yay
    - aur

# Required, not cosmetic: yay shells out to sudo with no tty, so it needs the
# warm sudo timestamp base leaves behind. Without it a tagged `-t packages` run
# fails with "sudo: a terminal is required" while a full converge works.
dependencies:
  - role: base
