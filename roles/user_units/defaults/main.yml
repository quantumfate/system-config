---
user_units_deploy: true

# Units this role installs into ~/.config/systemd/user. Every one carries its
# own [Install], so enablement is systemd's job and the .wants symlinks are
# never written by hand.
user_units_enabled:
  - ckb-next.service
  - cliphist-image.service
  - cliphist-text.service
  - copyq.service
  - foot-server.service
  - geoclue-agent.service
  - hypridle.service
  - hyprpaper.service
  - linear-app.service
  - obsidian.service
  - proton-mail.service
  - proton-pass.service
  - shelly-ui.service
  - shikane.service
  - signal-desktop.service
  - spotify.service
  - udiskie.service
  - vesktop.service

# Installed but never enabled: nothing wants them directly, other units name
# them with PartOf= so a theme or monitor change can restart a whole set.
user_units_passive:
  - hyprland-session.target
  - monitors-changed.target
  - theme-reload.target

# Packaged units this session wants. They live in /usr and are only enabled
# here, so the package stays their owner.
user_units_packaged_enabled:
  - hyprpolkitagent.service
  - hyprsunset.service

# A stop that overruns this is SIGKILLed, so it bounds how long a mode
# transition can block on a unit that will not go.
user_units_default_timeout_stop_sec: 3

# The capability targets, generated by the scripts checkout and committed
# there. Installed, never written, here: one mechanism per path.
user_units_targets_src: "{{ projects_dest.scripts }}/etc/systemd/user"
user_units_targets_generator: "{{ projects_dest.scripts }}/bin/,hyprfocus-units"
