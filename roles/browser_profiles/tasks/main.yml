---
- name: Create browser profiles by starting each browser once
  ansible.builtin.shell:
    cmd: timeout 5 {{ item }} --headless >/dev/null 2>&1 || true
  loop:
    - firefox
    - zen-twilight
    - zen-twilight -P Media
    # The gaming scene's own zen instance (the class hypr's windowrules pin to
    # name:gaming; the scene's declared companion spawns it — LEO-296). Zen
    # is single-instance per profile, so this is a distinct PROFILE, and its
    # user.js/chrome links ride the same shared source every other profile
    # links.
    - zen-twilight -P GamingMedia
  changed_when: false

- name: Check for the shared user.js
  ansible.builtin.stat:
    path: "{{ browser_config_src }}/user.js"
  register: user_js

- name: Link prefs into each profile
  ansible.builtin.include_tasks: link_profiles.yml
  loop: "{{ browser_roots }}"
  loop_control:
    loop_var: browser
    label: "{{ browser.name }}"
  when: user_js.stat.exists
