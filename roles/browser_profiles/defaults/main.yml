---
# browser_config_src lives in group_vars/all/main.yml: roles/theming renders
# user.js into it and this role links it into the profiles.

# Profile dirs to skip when symlinking — not real browser profiles.
browser_profile_excludes:
  - Profile Groups
  - firefox-mpris
  - Pending Pings
  - Crash Reports

browser_roots:
  - {name: Zen, path: "{{ target_home }}/.config/zen", zen: true}
  - {name: Firefox, path: "{{ target_home }}/.config/mozilla/firefox", zen: false}

# Symlinked into the profile root.
zen_profile_extras: [zen-themes.json]

# Symlinked into <profile>/chrome.
zen_chrome_extras:
  - userChrome.css
  - userContent.css
  - zen-logo-macchiato.svg
