---
# ansible-vault backend. Expects group_vars/all/vault.yml (encrypted) to define:
#   vault_ssh_keys: {github: {private: "...", public: "..."}, ...}
#   vault_gpg: {public: "...", private: "...", fingerprint: "..."}

- name: Write SSH private keys
  ansible.builtin.copy:
    content: "{{ vault_ssh_keys[item].private.rstrip() }}\n"
    dest: "{{ target_home }}/.ssh/{{ item }}"
    mode: "0600"
  loop: "{{ ssh_key_targets }}"
  no_log: true

- name: Write SSH public keys
  ansible.builtin.copy:
    content: "{{ vault_ssh_keys[item].public.rstrip() }}\n"
    dest: "{{ target_home }}/.ssh/{{ item }}.pub"
    mode: "0644"
  loop: "{{ ssh_key_targets }}"
  no_log: true

- name: Import GPG key material
  ansible.builtin.include_tasks: gpg_import.yml
  vars:
    gpg_public: "{{ vault_gpg.public }}"
    gpg_private: "{{ vault_gpg.private }}"
    gpg_fingerprint: "{{ vault_gpg.fingerprint }}"
