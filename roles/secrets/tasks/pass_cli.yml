---
# Key pairs out of the "Productivity" Proton Pass vault. no_log everywhere —
# the registers hold private key material. A missing session skips the writes
# instead of failing.

- name: Fetch SSH key items
  ansible.builtin.command: >-
    pass-cli item view --vault-name Productivity
    --item-title {{ item }} --output=json
  loop: "{{ ssh_key_targets }}"
  register: ssh_items
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Write SSH private keys
  ansible.builtin.copy:
    content: "{{ (item.stdout | from_json).item.content.content.SshKey.private_key.rstrip() }}\n"
    dest: "{{ target_home }}/.ssh/{{ item.item }}"
    mode: "0600"
  loop: "{{ ssh_items.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | default('') | length > 0
  no_log: true

- name: Write SSH public keys
  ansible.builtin.copy:
    content: "{{ (item.stdout | from_json).item.content.content.SshKey.public_key.rstrip() }}\n"
    dest: "{{ target_home }}/.ssh/{{ item.item }}.pub"
    mode: "0644"
  loop: "{{ ssh_items.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | default('') | length > 0
  no_log: true

- name: Report unreadable SSH items
  ansible.builtin.debug:
    msg: >-
      No Proton Pass session — skipped
      {{ ssh_items.results | selectattr('stdout', 'equalto', '') | map(attribute='item') | list }}
  when: ssh_items.results | selectattr('stdout', 'equalto', '') | list | length > 0

- name: Fetch GPG key item
  ansible.builtin.command: >-
    pass-cli item view --vault-name Productivity
    --item-title "GPG Key" --output=json
  register: gpg_item
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_facts.env.PATH }}"

- name: Import the GPG key
  when: gpg_item.stdout | default('') | length > 0
  block:
    - name: Extract GPG fields
      ansible.builtin.set_fact:
        gpg_fields: >-
          {{ (gpg_item.stdout | from_json).item.content.extra_fields
             | items2dict(key_name='name', value_name='content') }}
      no_log: true

    - name: Import GPG key material
      ansible.builtin.include_tasks: gpg_import.yml
      vars:
        gpg_public: "{{ gpg_fields['public.asc'].Hidden }}"
        gpg_private: "{{ gpg_fields['private.asc'].Hidden }}"
        gpg_fingerprint: "{{ gpg_fields['PGP Key Fingerprint'].Text }}"
