---
# Shared by both backends. Expects gpg_public / gpg_private / gpg_fingerprint.

- name: Check whether the key is already in the keyring
  ansible.builtin.command: gpg --list-secret-keys {{ gpg_fingerprint }}
  register: gpg_present
  changed_when: false
  failed_when: false
  check_mode: false

- name: Import and trust the key
  when: gpg_present.rc != 0
  block:
    - name: Stage key material in a private tempdir
      ansible.builtin.tempfile:
        state: directory
      register: gpg_tmp

    - name: Write ASCII-armoured keys
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ gpg_tmp.path }}/{{ item.name }}"
        mode: "0600"
      loop:
        - {name: public.asc, content: "{{ gpg_public }}"}
        - {name: private.asc, content: "{{ gpg_private }}"}
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Import keys
      ansible.builtin.command: gpg --batch --import {{ gpg_tmp.path }}/{{ item }}
      loop: [public.asc, private.asc]
      changed_when: true

    - name: Set ultimate ownertrust
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          printf '%s:6:\n' "{{ gpg_fingerprint }}" | gpg --batch --import-ownertrust
        executable: /bin/bash
      changed_when: true

  always:
    - name: Wipe tempdir
      ansible.builtin.file:
        path: "{{ gpg_tmp.path }}"
        state: absent
      when: gpg_tmp.path is defined
