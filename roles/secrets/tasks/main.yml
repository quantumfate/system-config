---
# SSH keys + GPG key material. Backend is selected by `secrets_backend`.

- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ target_home }}/.ssh"
    state: directory
    mode: "0700"

- name: Load secrets from Proton Pass
  ansible.builtin.include_tasks: pass_cli.yml
  when: secrets_backend == 'pass-cli'

- name: Load secrets from ansible-vault
  ansible.builtin.include_tasks: vault.yml
  when: secrets_backend == 'vault'
