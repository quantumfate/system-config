---
# The laptop. Internal panel plus an occasional HDMI head; same names as the
# `quantum-laptop` entry in the hypr checkout's hyprland.lua.
#
# greetd/tuigreet comes in through laptop_packages (profile == 'laptop'), so
# the sddm-owning display_manager role is off here.
#
# `gaming: false` also takes power_profile with it (roles_default derives it
# from the flag) — epp-performance pins the CPU to the performance governor,
# wrong on battery anyway.

profile: laptop

primary_monitor: eDP-1
secondary_monitor: HDMI-A-1

gaming: false
vms: false
llms: false
devenv: true

# This host predates the repo and its $HOME has drifted, so it is allowed to run
# the one-shot flush. Allowed, not scheduled: roles/reset still needs
# `-e reset_confirm=quantum-laptop` on the command line, and marks itself done
# afterwards.
reset_enabled: true

roles_override:
  # SDDM is the desktop greeter; the laptop boots into tuigreet.
  display_manager: false
