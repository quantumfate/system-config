---
# Every host converges itself over a local connection; the inventory exists so
# each machine gets its own host_vars file. site.yml is always run limited to
# the current machine — bootstrap.sh passes `--limit "$(hostname)"`, which is
# why the inventory names match `hostname` exactly (same keys the hypr checkout
# uses for its per-host config).
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    desktops:
      hosts:
        quantum-desktop:
    laptops:
      hosts:
        quantum-laptop:
